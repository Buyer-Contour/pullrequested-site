[build]
  publish = "public"

[[redirects]]
  from = "/quote"
  to = "/quote/index.html"
  status = 200
  force = true

[[headers]]
  for = "/offer.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
