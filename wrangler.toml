name = "phantompipe-payments"
main = "workers/payments.mjs"
compatibility_date = "2026-11-25"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
PAYMENTS_ORIGIN = "https://phantompipe.com"
MPP_NETWORK = "tempo"
MPP_PAY_TO = "0x1f31A5bFf4F43e6a7670D1125f52d8a845d9C85F"

[[durable_objects.bindings]]
name = "PAYMENTS_STATE"
class_name = "PaymentsState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PaymentsState"]
